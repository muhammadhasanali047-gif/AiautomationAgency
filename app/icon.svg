  <path d="M 85 42 L 89 44 L 92 42 L 95 44 L 94 48 L 98 52 L 102 52 L 102 56 L 98 58 L 98 64 L 102 66 L 101 70 L 97 71 L 95 76 L 98 80 L 95 83 L 90 82 L 87 86 L 82 85" stroke="url(#nexa-orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

